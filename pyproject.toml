[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-shield-es"
version = "0.2.0"
description = "Detección y anonimización 100 % local de datos personales en español (Colombia/LatAm)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "neurodeveloper11" }]
keywords = ["pii", "anonimizacion", "habeas-data", "colombia", "privacidad", "nlp", "espanol", "luhn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
pii-shield = "pii_shield_es.cli:main"

[project.urls]
Homepage = "https://github.com/neurodeveloper11/pii-shield-es"
Repository = "https://github.com/neurodeveloper11/pii-shield-es"
Issues = "https://github.com/neurodeveloper11/pii-shield-es/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pii_shield_es = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pii_shield_es"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # tildes y caracteres Unicode legítimos en español
    "RUF002",
    "RUF003",
]
