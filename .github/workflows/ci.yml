name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: python -m pip install --upgrade pip "ruff>=0.5"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: pytest con cobertura
        run: pytest --cov=pii_shield_es --cov-report=term-missing --cov-fail-under=95
      - name: Métricas, README y gráfica web sincronizados
        run: python eval/evaluate.py --check
      - name: Ejemplos de la web = salida real de la librería
        run: python scripts/build_docs.py --check
      - name: Humo de la CLI
        run: |
          pii-shield --version
          pii-shield anonimizar "Mi cédula es 1.023.456.789 y mi correo a@example.com"
          pii-shield tipos
          echo "Tarjeta 4111 1111 1111 1111 desde la IP 203.0.113.45" | pii-shield detectar --resumen
